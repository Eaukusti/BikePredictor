name: Poll city bike stations

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes — tune as you like
  workflow_dispatch: {}       # lets you trigger a run manually from GitHub's UI

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/poll_and_log.py
        env:
          DIGITRANSIT_API_KEY: ${{ secrets.DIGITRANSIT_API_KEY }}

      - name: Commit updated history back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv
          git diff --quiet --cached || git commit -m "Update bike station history"
          git push
